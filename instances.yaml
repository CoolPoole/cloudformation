AWSTemplateFormatVersion: '2010-09-09'
Description: Basic Security Group CloudFormation Template

# -----------------------------------------------------
# Parameters
#------------------------------------------------------

Parameters:

  pEnvironmentName:
    Description: Environment Name
    Type: String
    AllowedValues: [Workload, Development]
    Default: Development
    ConstraintDescription: must be workload or development

  pInstanceType:
    Description: EC2 Instance Type
    Type: String
    Default: t3.large
    AllowedValues:
      - t3.large
      - c5.4xlarge
      - c6i.4xlarge
      - c7i.4xlarge

  pImageID:
    Description: Various Image IDs
    Type: String
    Default: ami-08568a8b87f9b8ee3
    AllowedValues:
      - ami-08568a8b87f9b8ee3
      - ami-03b1242ace3ae693f
      - ami-018adf6c926c8bf88

  pKeyPairID:
    Description: SSH Keypair
    Type: AWS::EC2::KeyPair::KeyName
    Default: my-test-keypair

# ------------------------------------------------------
# Rules
# ------------------------------------------------------

Rules:

  rlsWorkloadInstanceType:
    RuleCondition: !Equals
      - !Ref pEnvironmentName
      - Workload
    Assertions:
      - Assert:
          'Fn::Contains':
            - - c5.4xlarge
              - c6i.4xlarge
              - c7i.4xlarge
            - !Ref pInstanceType
        AssertDescription: 'You cannot use a t3.large for Production'
      - Assert:
          'Fn::Contains':
            - - ami-018adf6c926c8bf88
            - !Ref pImageID
        AssertDescription: 'You cannot deploy a 25Mps or 200Mbps instance in Production'

  rlsDevelopmentInstanceType:
    RuleCondition: !Equals
      - !Ref pEnvironmentName
      - Development
    Assertions:
      - Assert:
          'Fn::Contains':
            - - c5.4xlarge
              - t3.large
            - !Ref pInstanceType
        AssertDescription: 'You cannot use a c6i.4xlarge or c7i.4xlarge for Development'
      - Assert:
          'Fn::Contains':
            - - ami-08568a8b87f9b8ee3
              - ami-03b1242ace3ae693f
            - !Ref pImageID
        AssertDescription: 'You do not need a full image in Development!'

# ------------------------------------------------------
# Metadata
# ------------------------------------------------------

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Environment Configuration"
        Parameters:
          - pEnvironmentName
      - Label:
          default: "EC2 Configuration"
        Parameters:
          - pInstanceType
          - pImageID
          - pKeyPairID
    ParameterLabels:
      pEnvironmentName:
        default: "Which Environment will this be deployed to?"
      pInstanceType:
        default: "What size instance would you like?"
      pImageID:
        default: "What Image would you like? 25 Mbps, 200 Mbps, or Full?"
      pKeyPairID:
        default: "Select Your KeyPair."

# ------------------------------------------------------
# Resources
# ------------------------------------------------------

Resources:

  rEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
#      AvailabilityZone: xxxxx
      BlockDeviceMappings:
        - DeviceName: /dev/xda
          Ebs:
            VolumeType: gp3
            VolumeSize: 100
            DeleteOnTermination: false
            Encrypted: true
        - DeviceName: /dev/xvdb
          Ebs:
            VolumeType: gp3
            VolumeSize: 20
            DeleteOnTermination: false
            Encrypted: true
      EnclaveOptions:
        Enabled: false
      HibernationOptions:
        Configured: false
      InstanceType: !Ref pInstanceType
      ImageId: !Ref pImageID
      InstanceInitiatedShutdownBehavior: stop
      Tenancy: default
      KeyName: !Ref pKeyPairID
      LaunchTemplate:
        LaunchTemplateId: !ImportValue IMDSv2-LaunchTemplate
        Version: '1'
      Monitoring: false
      NetworkInterfaces:
        - GroupSet:
            - !ImportValue MgmtSecurityGroup
          PrivateIpAddress: 10.1.2.15
          AssociatePublicIpAddress: false
          DeviceIndex: '0'
          DeleteOnTermination: true
          SubnetId:
            - !ImportValue Mgmt-Subnet
      PropagateTagsToVolumeCreation: true
      SourceDestCheck: false
      SubnetId: !ImportValue Mgmt-Subnet
      Tags:
        - Key: Name
          Value: !Sub ${pEnvironmentName}-vm
        - Key: Department
          Value: "EmotionalAmeobas"

  rInternalInterface:
    Type: AWS::EC2::NetworkInterface
    Properties:
      Description: "The Internal Subnet Interface"
      GroupSet:
        - !ImportValue InternalSecurityGroup
      PrivateIpAddress: 10.1.3.15
      SourceDestCheck: false
      SubnetId: !ImportValue Private-Subnet-1
      Tags:
        - Key: Name
          Value: !Sub ${pEnvironmentName}-internal

  rInternalInterfaceAttachment:
    Type: AWS::EC2::NetworkInterfaceAttachment
    Properties:
      DeleteOnTermination: true
      DeviceIndex: 1
      InstanceId: !Ref rEC2Instance
      NetworkInterfaceId: !Ref rInternalInterface

  rExternalInterface:
    Type:  AWS::EC2::NetworkInterface
    Properties:
      Description: "The External Subnet Interface"
      GroupSet:
        - !ImportValue ExternalSecurityGroup
      PrivateIpAddress: 10.1.1.15
      SourceDestCheck: false
      SubnetId: !ImportValue Public-Subnet-1
      Tags:
        - Key: Name
          Value: !Sub ${pEnvironmentName}-external

  rExternalInterfaceAttachment:
    Type: AWS::EC2::NetworkInterfaceAttachment
    Properties:
      DeleteOnTermination: true
      DeviceIndex: 2
      InstanceId: !Ref rEC2Instance
      NetworkInterfaceId: !Ref rExternalInterface

# -------------------------------------------------------
# Outputs
# -------------------------------------------------------


